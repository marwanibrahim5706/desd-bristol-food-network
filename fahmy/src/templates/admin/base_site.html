{% extends "admin/base_site.html" %}

{% block title %}Bristol Food Network Admin{% endblock %}

{% block branding %}
  <div class="site-admin-brand">
    <span class="site-admin-mark">B</span>
    <span>
      <strong>Bristol Food Network</strong>
      <small>Admin workspace</small>
    </span>
  </div>
{% endblock %}

{% block nav-global %}
  <a class="site-admin-link" href="/finance/admin/dashboard/">Finance workspace</a>
{% endblock %}

{% block extrastyle %}
  {{ block.super }}
  <style>
    :root{
      color-scheme:light;
      --primary:#25635a;
      --secondary:#174c45;
      --accent:#1f6f9f;
      --primary-fg:#fff;
      --body-bg:#f4f7f9;
      --body-fg:#111827;
      --body-quiet-color:#64748b;
      --body-loud-color:#111827;
      --header-bg:#1f2937;
      --header-color:#ffffff;
      --breadcrumbs-bg:#e8f3f1;
      --breadcrumbs-fg:#174c45;
      --link-fg:#25635a;
      --link-hover-color:#174c45;
      --default-button-bg:#25635a;
      --default-button-hover-bg:#174c45;
      --button-bg:#25635a;
      --button-hover-bg:#174c45;
      --hairline-color:#e6ebf0;
      --border-color:#d7dee6;
      --darkened-bg:#eef3f7;
      --selected-bg:#e8f3f1;
      --message-success-bg:#e8f7ef;
      --message-warning-bg:#fff7e6;
      --message-error-bg:#fff1f1;
    }

    html,
    body{
      color-scheme:light;
    }

    body{
      font-family:"Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
      background:var(--body-bg);
      color:var(--body-fg);
    }

    #header{
      min-height:72px;
      padding:12px 28px;
      background:var(--header-bg);
      color:var(--header-color);
      border-bottom:1px solid rgba(255,255,255,.08);
      box-shadow:0 10px 24px rgba(15,23,42,.12);
    }

    .site-admin-brand{
      display:flex;
      align-items:center;
      gap:12px;
      color:var(--header-color);
    }

    .site-admin-brand strong{
      display:block;
      font-size:16px;
      line-height:1.2;
    }

    .site-admin-brand small{
      display:block;
      margin-top:3px;
      color:rgba(255,255,255,.68);
      font-size:12px;
    }

    .site-admin-mark{
      width:38px;
      height:38px;
      display:grid;
      place-items:center;
      border-radius:14px;
      background:linear-gradient(135deg, #1fa37a, #2563eb);
      color:#fff;
      font-weight:900;
    }

    #user-tools,
    #user-tools a{ color:rgba(255,255,255,.74); }

    #user-tools a:hover{
      color:#fff;
    }

    .site-admin-link{
      display:inline-flex;
      align-items:center;
      min-height:36px;
      margin-left:8px;
      padding:0 12px;
      border-radius:999px;
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.18);
      color:#fff;
      font-weight:800;
      text-decoration:none;
    }

    .site-admin-link:hover{
      background:rgba(255,255,255,.16);
      color:#fff;
    }

    #container,
    #main,
    #content,
    #content-main,
    #content-related,
    .main,
    .dashboard{
      background:var(--body-bg) !important;
      color:var(--body-fg) !important;
    }

    #content{
      padding:32px;
    }

    .module,
    .dashboard .module,
    #content-main .module,
    .inline-group{
      border:1px solid var(--hairline-color);
      border-radius:12px;
      overflow:hidden;
      background:#fff;
      box-shadow:0 12px 28px rgba(15,23,42,.06);
    }

    .module *,
    #content-related *,
    #recent-actions-module *{
      color:inherit;
    }

    .module h2,
    .module caption,
    .inline-group h2,
    caption,
    .section{
      background:#f8fafc !important;
      color:var(--body-fg) !important;
      font-weight:900;
      letter-spacing:-.01em;
      padding:14px 18px;
      border-bottom:1px solid var(--hairline-color);
    }

    .module caption a,
    .module h2 a,
    .inline-group h2 a,
    caption a,
    .section a{
      color:var(--body-fg) !important;
    }

    #content-main table,
    #content-related,
    #content-related .module,
    #recent-actions-module,
    .module table,
    .results,
    .results table,
    .app-list,
    .model-list,
    #changelist,
    #changelist table,
    .form-row,
    fieldset,
    .aligned label{
      background:#fff !important;
      color:var(--body-fg) !important;
    }

    #content-main tr,
    #content-main tbody tr,
    #content-related tr,
    #content-related tbody tr,
    .results tr,
    .results tbody tr,
    .row1,
    .row2,
    .app-list tr,
    .model-list tr{
      background:#fff !important;
      color:var(--body-fg) !important;
    }

    #content-main tr:nth-child(even),
    #content-related tr:nth-child(even),
    .results tr:nth-child(even),
    .app-list tr:nth-child(even),
    .model-list tr:nth-child(even){
      background:#f8fafc !important;
    }

    #content-main td,
    #content-main th,
    #content-related td,
    #content-related th,
    .results td,
    .results th,
    .app-list td,
    .app-list th,
    .model-list td,
    .model-list th,
    thead th,
    tbody th{
      color:var(--body-fg) !important;
      background:transparent !important;
    }

    #content-main a,
    #content-related a,
    .results a{
      color:var(--link-fg) !important;
    }

    #content-related h2,
    #content-related h3,
    #recent-actions-module h2,
    #recent-actions-module h3{
      color:var(--body-fg) !important;
      background:#f8fafc !important;
    }

    #recent-actions-module p,
    #recent-actions-module li,
    #recent-actions-module .quiet,
    #recent-actions-module .mini,
    .quiet,
    .help,
    p.help,
    div.help{
      color:var(--body-quiet-color) !important;
    }

    a:link,
    a:visited{
      color:var(--link-fg);
    }

    a:hover,
    a:focus{
      color:var(--link-hover-color);
    }

    table{
      border-collapse:separate;
      border-spacing:0;
    }

    td,
    th{
      padding:13px 14px;
      border-color:var(--hairline-color);
    }

    input,
    select,
    textarea,
    .vTextField{
      border-radius:12px;
      border:1px solid var(--border-color);
      padding:10px 12px;
      background:#fff;
      color:var(--body-fg);
    }

    .button,
    input[type=submit],
    input[type=button],
    .submit-row input{
      border-radius:12px;
      padding:10px 15px;
      font-weight:900;
      box-shadow:none;
    }

    .submit-row{
      border:1px solid var(--hairline-color);
      border-radius:12px;
      background:#fff;
      box-shadow:0 12px 28px rgba(15,23,42,.06);
    }
  </style>
{% endblock %}
