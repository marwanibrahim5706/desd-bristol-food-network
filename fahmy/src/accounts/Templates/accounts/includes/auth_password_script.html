<script>
  (function() {
    const toggles = document.querySelectorAll('[data-password-toggle]');

    toggles.forEach(function(toggle) {
      const targetId = toggle.getAttribute('data-target');
      const input = document.getElementById(targetId);
      const showLabel = toggle.getAttribute('data-show-label') || 'Show';
      const hideLabel = toggle.getAttribute('data-hide-label') || 'Hide';
      const showAria = toggle.getAttribute('data-show-aria') || 'Show password';
      const hideAria = toggle.getAttribute('data-hide-aria') || 'Hide password';

      if (!input) {
        return;
      }

      toggle.addEventListener('click', function() {
        const shouldShow = input.type === 'password';
        input.type = shouldShow ? 'text' : 'password';
        toggle.textContent = shouldShow ? hideLabel : showLabel;
        toggle.setAttribute('aria-pressed', shouldShow ? 'true' : 'false');
        toggle.setAttribute('aria-label', shouldShow ? hideAria : showAria);
      });
    });

    document.querySelectorAll('[data-password-meter-for]').forEach(function(meter) {
      const targetId = meter.getAttribute('data-password-meter-for');
      const input = document.getElementById(targetId);

      if (!input) {
        return;
      }

      const fill = meter.querySelector('[data-password-meter-fill]');
      const label = meter.querySelector('[data-password-meter-label]');
      const states = {
        empty: { label: 'Password strength:', width: '0%', className: '' },
        weak: { label: 'Password strength: Weak', width: '33%', className: 'is-weak' },
        medium: { label: 'Password strength: Medium', width: '66%', className: 'is-medium' },
        strong: { label: 'Password strength: Strong', width: '100%', className: 'is-strong' }
      };

      function evaluateStrength(value) {
        if (!value) {
          return 'empty';
        }

        const hasLower = /[a-z]/.test(value);
        const hasUpper = /[A-Z]/.test(value);
        const hasNumber = /\d/.test(value);
        const hasSymbol = /[^A-Za-z0-9]/.test(value);
        const categories = [hasLower, hasUpper, hasNumber, hasSymbol].filter(Boolean).length;
        const onlyLetters = /^[A-Za-z]+$/.test(value);
        const onlyNumbers = /^\d+$/.test(value);

        if (value.length >= 10 && hasLower && hasUpper && hasNumber && hasSymbol) {
          return 'strong';
        }

        if (value.length < 8 || onlyLetters || onlyNumbers) {
          return 'weak';
        }

        if (value.length >= 8 && categories >= 2) {
          return 'medium';
        }

        return 'weak';
      }

      function renderStrength() {
        const state = states[evaluateStrength(input.value)];

        meter.hidden = false;
        meter.classList.remove('is-weak', 'is-medium', 'is-strong');
        if (state.className) {
          meter.classList.add(state.className);
        }

        if (fill) {
          fill.style.width = state.width;
        }

        if (label) {
          label.textContent = state.label;
        }
      }

      input.addEventListener('input', renderStrength);
      renderStrength();
    });
  }());
</script>
